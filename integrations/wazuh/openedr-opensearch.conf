input {
  file {
    path => "/var/ossec/logs/alerts/alerts.json"
    start_position => "end"
    sincedb_path => "${OPENEDR_SINCEDB_PATH}"
    codec => json
  }
}

filter {
  if [data][openedr_source] != "all-os-openedr" or ![data][openedr_event_id] {
    drop {}
  }
  date {
    match => ["[data][openedr_observed_at]", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_openedr_invalid_timestamp"]
  }
}

output {
  if "_openedr_invalid_timestamp" not in [tags] {
    opensearch {
      hosts => ["${OPENEDR_OPENSEARCH_URL}"]
      user => "${OPENEDR_OPENSEARCH_USERNAME}"
      password => "${OPENEDR_OPENSEARCH_PASSWORD}"
      ssl => true
      cacert => "${OPENEDR_OPENSEARCH_CA_FILE}"
      ssl_certificate_verification => true
      manage_template => false
      index => "openedr-alerts-v1-%{{yyyy.MM.dd}}"
      document_id => "%{[data][openedr_event_id]}"
    }
  }
}
