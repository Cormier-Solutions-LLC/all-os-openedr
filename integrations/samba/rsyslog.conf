template(name="OpenedrSambaAudit" type="string"
         string="%timereported:::date-rfc3164% %hostname% openedr_smb_audit:%msg%\n")

if ($programname == "smbd_audit" and $syslogfacility-text == "local6" and
    $msg startswith " openedr-smb-v1|") then {
    action(type="omfile" file="/var/log/samba/openedr-share-audit.log"
           template="OpenedrSambaAudit" fileCreateMode="0640"
           fileOwner="root" fileGroup="adm")
}
