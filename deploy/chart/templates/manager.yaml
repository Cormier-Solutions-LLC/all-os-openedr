{{- $name := printf "%s-openedr" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $labels := dict "app.kubernetes.io/name" "all-os-openedr-manager" "app.kubernetes.io/instance" .Release.Name -}}
{{- if lt (int .Values.replicaCount) 2 -}}
{{- fail "replicaCount must be at least 2" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{ $labels | toJson }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{ $labels | toJson }}
  template:
    metadata:
      labels: {{ $labels | toJson }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          labelSelector:
            matchLabels: {{ $labels | toJson }}
      containers:
        - name: manager
          image: {{ required "image is required" .Values.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{ .Values.resources | toJson }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 4
            periodSeconds: 10
          env:
            - name: OPENSEARCH_URL
              value: {{ required "opensearchUrl is required" .Values.opensearchUrl | quote }}
            - name: OPENSEARCH_INDEX_PREFIX
              value: {{ .Values.opensearchIndexPrefix | quote }}
            - name: OPENSEARCH_CA_FILE
              value: /run/opensearch/ca.crt
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "opensearchSecret is required" .Values.opensearchSecret | quote }}
                  key: username
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opensearchSecret | quote }}
                  key: password
            - name: MANAGER_TOKEN_FILE
              value: /run/manager/token
          volumeMounts:
            - name: opensearch
              mountPath: /run/opensearch
              readOnly: true
            - name: manager
              mountPath: /run/manager
              readOnly: true
      volumes:
        - name: opensearch
          secret:
            secretName: {{ .Values.opensearchSecret | quote }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: manager
          secret:
            secretName: {{ required "managementSecret is required" .Values.managementSecret | quote }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{ $labels | toJson }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
  selector: {{ $labels | toJson }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{ $labels | toJson }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{ $labels | toJson }}
